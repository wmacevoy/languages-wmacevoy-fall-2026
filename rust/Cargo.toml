[package]
name = "hello"
version = "0.1.0"
edition = "2021"
description = "CSCI 330 cross-compilation demo: a greeting library and a CLI that reports the platform it was built for."
license = "MIT"

# The crate is a library first; the binary is one consumer of it. Declaring both
# explicitly keeps `cargo test` covering the lib, the bin, the integration tests
# and the doc examples.
[lib]
name = "hello"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
