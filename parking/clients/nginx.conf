# Serve the built page, and forward /api to the Express service. The browser sees one origin,
# exactly as it does for the vanilla app that Express serves itself, so the API needs no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://app:3000;
    }

    location / {
        try_files $uri /index.html;
    }
}
