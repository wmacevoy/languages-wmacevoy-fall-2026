version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_pass
      POSTGRES_DB: parking
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  app:
    # From parking/, so the server can include the checks in clients/shared.
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://parking_user:parking_pass@db:5432/parking
      JWT_SECRET: demo-secret-change-me
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"

  # The same app rebuilt in React and in Vue, side by side with the vanilla one on :3000.
  react:
    build:
      context: .
      dockerfile: clients/web.Dockerfile
      args:
        CLIENT: react
    depends_on:
      - app
    ports:
      - "3001:80"

  vue:
    build:
      context: .
      dockerfile: clients/web.Dockerfile
      args:
        CLIENT: vue
    depends_on:
      - app
    ports:
      - "3002:80"

volumes:
  pgdata:
