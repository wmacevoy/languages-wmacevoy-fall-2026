name: rust

# Only pushes that touch rust/ (or this file) are relevant, so everything else
# in the repo -- the docs site, the PDFs -- never triggers a build.
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

# Read-only: nothing here writes to the repo, publishes a package or comments.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Ordered cheapest-first, so an obvious mistake fails in seconds.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets --all-features

      # Covers four harnesses: lib unit tests, bin unit tests, tests/greet.rs,
      # and the doc example on greet().
      - name: Test
        run: cargo test --locked --all-features

  cross-build:
    name: cross-compile
    # No point cross-compiling six targets from code that fails its own tests.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Deliberately the same command a developer runs locally -- build.sh
      # builds the image and does everything else inside it, so there is no
      # separate CI recipe that can drift away from the local one.
      - name: Build every target
        run: ./build.sh

      - name: Publish the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ github.sha }}
          path: rust/dist/
          if-no-files-found: error
          retention-days: 14
