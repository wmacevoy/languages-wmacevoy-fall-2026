name: ml

# Only pushes that touch ml/ (or this file) are relevant.
on:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  test:
    # The claim under test is that one manifest resolves correctly on three
    # different operating systems, so the matrix *is* the evidence.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Never cancel the other OSes: when this breaks, the interesting question
      # is always "which platforms broke", and fail-fast hides that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: ml/pixi.toml
          # Only the default environment: the cuda one requires an NVIDIA GPU,
          # which no hosted runner has. That it *locks* correctly is asserted by
          # the test suite, which reads pixi.lock directly.
          environments: default
          # Fail if pixi.lock does not match pixi.toml, rather than silently
          # re-solving. This is what makes the run reproduce the committed lock.
          locked: true
          # Pinned to the version that produced pixi.lock. Upgrading is then a
          # deliberate one-line change rather than something that happens to us.
          pixi-version: v0.76.2
          # Deliberately off. Caching would restore a previously-good environment
          # and skip the install entirely on any push that does not touch the
          # lock -- but installing from the lock is one of the things this
          # workflow is supposed to check, and it is what every student does on
          # a fresh clone. A cold install costs 13-41s per OS, which is cheaper
          # than not testing it.
          cache: false

      # The payoff: this line differs per operating system, from one manifest.
      - name: Report the accelerator this runner resolved to
        run: pixi run -q device

      - name: Show what every platform resolved to
        run: pixi run -q resolved

      # Exercises the accelerator path end to end. On the macOS runner this
      # really does dispatch to Metal; elsewhere it reports that there is
      # nothing to compare against, and either outcome is informative.
      - name: Benchmark the accelerator against the CPU
        run: pixi run -q bench

      # 22 tests, including the two that matter across platforms: that the
      # installed artifact matches the lock, and that the model generalises on
      # whatever backend this runner has.
      - name: Test
        run: pixi run -q test
